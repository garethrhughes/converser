services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: converser
      POSTGRES_PASSWORD: converser_local
      POSTGRES_DB: converser
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U converser"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
